        :root {
            --bg-color: #0f172a;

        body {

            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        p.subtitle {
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            max-width: 600px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .tester-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        textarea {
            width: 100%;
            height: 70px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            padding: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            resize: vertical;
            font-family: monospace;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .result-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-weight: 500;
            display: none;
        }

        .result-box.valid {
            background-color: rgba(34, 197, 94, 0.2);
            border: 1px solid var(--success-color);
            color: var(--success-color);
            display: block;
        }

        .result-box.invalid {
            background-color: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--error-color);
            color: var(--error-color);
            display: block;
        }

        .paths-info {
            font-size: 0.85rem;
            margin-top: 8px;
            color: #cbd5e1;
            font-family: monospace;
        }

        .phrase-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 768px) {
            .phrase-list {
                grid-template-columns: 1fr 1fr;
            }
        }

        .phrase-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 15px;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.1s;
            position: relative;
        }

        .phrase-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .phrase-card .type {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .phrase-card .text {
            font-family: monospace;
            font-size: 0.9rem;
            color: #e2e8f0;
            line-height: 1.4;
        }

        .phrase-card .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .badge.valid {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success-color);
        }

        .badge.invalid {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--error-color);
        }
    </style>
</head>

        // Initialize UI
        document.addEventListener("DOMContentLoaded", () => {
            const listEl = document.getElementById("phraseList");

            phrases.forEach((item, index) => {
                const isValid = bip39.validateMnemonic(item.text);
                const card = document.createElement("div");
                card.className = "phrase-card";
                card.onclick = () => selectPhrase(item.text);

                card.innerHTML = `
                    <div class="type">${item.type}</div>
                    <div class="text">${item.text}</div>
                    <span class="badge ${isValid ? 'valid' : 'invalid'}">
                        ${isValid ? 'VALID' : 'INVALID'}
                    </span>
                `;
                listEl.appendChild(card);
            });
        });

        function selectPhrase(text) {
            document.getElementById("mnemonicInput").value = text;
            validateInput();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function clearInput() {
            document.getElementById("mnemonicInput").value = "";
            const resultBox = document.getElementById("resultBox");
            resultBox.className = "result-box";
            resultBox.style.display = "none";
        }

        function validateInput() {
            const input = document.getElementById("mnemonicInput").value.trim().toLowerCase().replace(/\s+/g, ' ');
            const resultBox = document.getElementById("resultBox");

            if (!input) {
                resultBox.className = "result-box invalid";
                resultBox.innerHTML = "Please enter a mnemonic phrase.";
                return;
            }

            const isValid = bip39.validateMnemonic(input);
            const wordCount = input.split(' ').length;

            if (isValid) {
                resultBox.className = "result-box valid";
                resultBox.innerHTML = `
                    <strong>✓ Valid BIP-39 Checksum!</strong> (${wordCount} words)
                    <div class="paths-info">
                        <strong>Derivation Paths Standardized for this Seed:</strong><br>
                        • BIP-44 (Legacy): m/44'/0'/0'/0/0<br>
                        • BIP-84 (Native SegWit): m/84'/0'/0'/0/0
                    </div>
                `;
            } else {
                resultBox.className = "result-box invalid";
                resultBox.innerHTML = `
                    <strong>✗ Invalid BIP-39 Mnemonic or Checksum.</strong><br>
                    <span style="font-size: 0.85rem; font-weight: normal;">
                        Ensure all words exist in the 2,048-word BIP-39 dictionary and the length is 12, 15, 18, 21, or 24 words with a valid checksum final word.

                `;
            }

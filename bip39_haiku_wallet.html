        }

            padding: 0;

            background: rgba(15, 23, 42, 0.95);

            padding: 1.25rem 0;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

            font-family: 'Space Grotesk', system_ui, sans-serif;
            font-size: 2.25rem;
            font-weight: 700;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

        }
        
        .subtitle {
            color: #64748b;
            font-size: 1.05rem;
            margin-top: 0.25rem;
        }
        
        .card {
            background: #1e2937;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 1.75rem;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        
        .section-title {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #f1e7ff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: none;
            text-decoration: none;
        }
        
        .btn-primary {
            background: #6366f1;
            color: white;
        }
        
        .btn-primary:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }
        
        .btn-secondary:hover {
            background: #475569;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-success {
            background: #22c55e;
            color: white;
        }
        
        .input {
            background: #0f172a;
            border: 1px solid #475569;
            color: #e2e8f0;
            padding: 0.65rem 1rem;
            border-radius: 10px;
            font-size: 0.95rem;
            width: 100%;
            transition: border-color 0.2s;
        }
        
        .input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .haiku-line {
            font-family: 'Space Grotesk', system_ui, sans-serif;
            font-size: 1.35rem;
            line-height: 1.4;
            margin: 0.35rem 0;
            padding: 0.5rem 0;
            color: #e0d0ff;
        }
        
        .haiku-container {
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            position: relative;
        }
        
        .mnemonic-full {
            font-family: ui-monospace, monospace;
            font-size: 0.875rem;
            background: #1e2937;
            padding: 0.75rem;
            border-radius: 8px;
            word-break: break-all;
            color: #94a3b8;
            margin-top: 0.75rem;
        }
        
        .wallet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.25rem;
        }
        
        .status {
            font-size: 0.875rem;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;

            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
        }

            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 0.35rem;
            display: block;
            font-weight: 500;
        }
        
        .syllable-badge {
            font-size: 0.75rem;
            background: #334155;
            color: #94a3b8;
            padding: 0.1rem 0.5rem;
            border-radius: 9999px;
            display: inline-block;
        }
        
        .nav-tabs {
            display: flex;
            border-bottom: 1px solid #334155;
            margin-bottom: 1.5rem;
        }
        
        .nav-tab {
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

            border-bottom-color: #6366f1;
            color: #6366f1;
        }

            font-size: 0.875rem;
            color: #64748b;
        }

            text-align: center;
            padding: 3rem 1rem;
            color: #64748b;
        }

            content: "•";
            color: #6366f1;
            margin-right: 0.5rem;
        }
        
        .footer-note {
            font-size: 0.75rem;
            color: #475569;
            text-align: center;
            margin-top: 2rem;

            transition: transform 0.2s, box-shadow 0.2s;

    <div class="header">
        <div class="container">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <h1>BIP-39 Haiku</h1>
                    <p class="subtitle">Bitcoin Wallet Generator • Offline Standalone</p>
                </div>
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <div class="status status-valid">
                        <span style="width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block;"></span>
                        <span style="font-weight: 600;">Offline • Valid Checksum</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
        
        <!-- Generator Section -->
        <div class="card" style="margin-bottom: 2rem;">
            <div class="section-title">
                <span>⛏️ Mine Haiku Wallets</span>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 1.25rem; align-items: end;">
                <div>
                    <label class="label">Mnemonic Length</label>
                    <select id="wordCountSelect" class="input">
                        <option value="12">12 words (128-bit)</option>
                        <option value="24">24 words (256-bit)</option>
                    </select>
                </div>
                
                <div>
                    <label class="label">Mine Count</label>
                    <input type="number" id="mineCount" class="input" value="5" min="1" max="50">
                </div>
                
                <div>
                    <label class="label">Wallet Type</label>
                    <select id="walletType" class="input">
                        <option value="bitcoin">Bitcoin (BIP-44)</option>
                        <option value="ethereum">Ethereum</option>
                        <option value="litecoin">Litecoin</option>
                        <option value="bitcoin-cash">Bitcoin Cash</option>
                    </select>
                </div>
                
                <div>
                    <button onclick="mineHaikus()" class="btn btn-primary" style="width: 100%; padding: 0.85rem 1.75rem; font-size: 1rem;">
                        ⛏️ Mine Haikus
                    </button>
                </div>
            </div>
            
            <div style="margin-top: 1rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="strictSyllable" checked style="accent-color: #6366f1;">
                    <label for="strictSyllable" style="font-size: 0.875rem; color: #94a3b8;">Require exact 5-7-5 syllable haiku</label>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="autoValidate" checked style="accent-color: #6366f1;">
                    <label for="autoValidate" style="font-size: 0.875rem; color: #94a3b8;">Validate BIP-39 checksum</label>
                </div>
            </div>
            
            <div id="mineStatus" style="margin-top: 1rem; font-size: 0.875rem; color: #64748b; display: none;"></div>
        </div>
        
        <!-- Generated Results -->
        <div id="resultsSection" style="display: none; margin-bottom: 2.5rem;">
            <div class="section-title">
                <span>Generated Haiku Wallets</span>
                <button onclick="clearResults()" class="btn btn-secondary" style="padding: 0.4rem 1rem; font-size: 0.8rem; margin-left: auto;">Clear Results</button>
            </div>
            <div id="resultsGrid" class="wallet-grid"></div>
        </div>
        
        <!-- My Wallets Section -->
        <div class="card">
            <div class="section-title">
                <span>💾 My Saved Haiku Wallets</span>
                <div style="margin-left: auto; display: flex; gap: 0.5rem;">
                    <button onclick="exportEncryptedList()" class="btn btn-secondary" style="padding: 0.5rem 1.1rem; font-size: 0.875rem;">
                        🔐 Export Encrypted (AES-256)
                    </button>
                    <button onclick="clearAllWallets()" class="btn btn-danger" style="padding: 0.5rem 1.1rem; font-size: 0.875rem;">
                        Clear All
                    </button>
                </div>
            </div>
            
            <div id="savedWalletsContainer">
                <!-- Populated by JS -->
            </div>
            
            <div class="footer-note">
                List persisted in localStorage • Wordlist embedded locally • Fully offline
            </div>
        </div>
        
    </div>

        // Create word to index map for fast lookup
        const wordToIndex = {};
        bip39Words.forEach((word, index) => {
            wordToIndex[word] = index;
        });
        
        // Real syllable counting function (heuristic but effective for BIP-39 words)
        function countSyllables(word) {
            if (!word) return 0;
            word = word.toLowerCase().replace(/[^a-z]/g, '');
            if (word.length === 0) return 0;
            if (word.length <= 3) return 1;
            
            // Remove common silent endings
            let temp = word;
            if (temp.endsWith('e') && !temp.endsWith('le')) {
                temp = temp.slice(0, -1);
            }
            if (temp.endsWith('es')) temp = temp.slice(0, -2);
            if (temp.endsWith('ed')) temp = temp.slice(0, -2);
            
            // Count vowel groups
            const vowels = /[aeiouy]+/g;
            const matches = temp.match(vowels);
            let count = matches ? matches.length : 1;
            
            // Special cases for accuracy on common words
            if (word.endsWith('le') && word.length > 2 && !/[aeiouy]/.test(word[word.length - 3])) {
                count++;
            }
            if (word === 'people' || word === 'table' || word === 'little') count = 2;
            if (word === 'beautiful' || word === 'family') count = 3;
            
            return Math.max(1, count);
        }
        
        // Convert bytes to binary string
        function bytesToBinary(bytes) {
            return Array.from(bytes)
                .map(byte => byte.toString(2).padStart(8, '0'))
                .join('');
        }
        
        // SHA-256 using Web Crypto API
        async function sha256(buffer) {
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            return new Uint8Array(hashBuffer);
        }
        
        // Generate valid BIP-39 mnemonic with proper checksum
        async function generateBip39Mnemonic(wordCount = 12) {
            const strength = wordCount === 12 ? 128 : 256;
            const entropy = new Uint8Array(strength / 8);
            crypto.getRandomValues(entropy);
            
            const entropyBits = bytesToBinary(entropy);
            
            // Compute checksum (first strength/32 bits of SHA256)
            const hash = await sha256(entropy);
            const hashBits = bytesToBinary(hash);
            const checksumLength = strength / 32;
            const checksumBits = hashBits.slice(0, checksumLength);
            
            const fullBits = entropyBits + checksumBits;
            
            // Split into 11-bit chunks
            const indices = [];
            for (let i = 0; i < fullBits.length; i += 11) {
                const chunk = fullBits.slice(i, i + 11);
                indices.push(parseInt(chunk, 2));
            }
            
            const mnemonic = indices.map(index => bip39Words[index]);
            return mnemonic;
        }
        
        // Validate BIP-39 mnemonic checksum (for multiple wallet types)
        async function validateBip39Checksum(mnemonicStr) {
            const words = mnemonicStr.trim().split(/\s+/);
            if (![12, 24].includes(words.length)) return false;
            
            const indices = words.map(w => wordToIndex[w]);
            if (indices.some(i => i === undefined)) return false;
            
            let bits = '';
            for (let idx of indices) {
                bits += idx.toString(2).padStart(11, '0');
            }
            
            const entropyBitsLen = words.length === 12 ? 128 : 256;
            const checksumBitsLen = words.length === 12 ? 4 : 8;
            
            const entropyBits = bits.slice(0, entropyBitsLen);
            const providedChecksum = bits.slice(entropyBitsLen);
            
            // Reconstruct entropy bytes
            const entropyBytes = new Uint8Array(entropyBitsLen / 8);
            for (let i = 0; i < entropyBitsLen; i += 8) {
                entropyBytes[i / 8] = parseInt(entropyBits.slice(i, i + 8), 2);
            }
            
            const hash = await sha256(entropyBytes);
            const hashBits = bytesToBinary(hash);
            const expectedChecksum = hashBits.slice(0, checksumBitsLen);
            
            return providedChecksum === expectedChecksum;
        }
        
        // Find haiku split (5-7-5 syllables) with real counting
        function findHaikuSplit(syls) {
            const n = syls.length;
            const prefix = [0];
            for (let s of syls) {
                prefix.push(prefix[prefix.length - 1] + s);
            }
            const total = prefix[n];
            
            if (total !== 17) return null;
            
            for (let i = 0; i < n; i++) {
                if (prefix[i + 1] === 5) {
                    for (let j = i + 1; j < n; j++) {
                        if (prefix[j + 1] - prefix[i + 1] === 7) {
                            if (prefix[n] - prefix[j + 1] === 5) {
                                return { line1End: i, line2End: j };
                            }
                        }
                    }
                }
            }
            return null;
        }

            while (results.length < count && attempts < maxAttempts) {

                    await new Promise(r => setTimeout(r, 10));

                try {

                    const mnemonicStr = mnemonicWords.join(' ');
                    
                    // Validate checksum
                    let isValid = true;
                    if (validate) {

                    }
                    
                    if (!isValid) continue;
                    
                    const syls = mnemonicWords.map(w => countSyllables(w));
                    const split = findHaikuSplit(syls);
                    
                    if (split || !strict) {
                        let haikuData;
                        
                        if (split) {
                            const line1Words = mnemonicWords.slice(0, split.line1End + 1);
                            const line2Words = mnemonicWords.slice(split.line1End + 1, split.line2End + 1);
                            const line3Words = mnemonicWords.slice(split.line2End + 1);
                            
                            haikuData = {

                                line3Syl: syls.slice(split.line2End + 1).reduce((a, b) => a + b, 0)
                            };
                        } else {
                            // Fallback: split roughly into 3 lines
                            const third = Math.floor(mnemonicWords.length / 3);
                            haikuData = {

                                line2: mnemonicWords.slice(third, third * 2).join(' '),
                                line3: mnemonicWords.slice(third * 2).join(' '),
                                line1Syl: syls.slice(0, third).reduce((a, b) => a + b, 0),

                        const result = {

                            haiku: haikuData,

                            totalSyllables: syls.reduce((a, b) => a + b, 0),
                            timestamp: new Date().toISOString(),
                            wordCount: wordCount,
                            walletType: walletType,
                            checksumValid: isValid
                        };
                        
                        results.push(result);
                        currentResults.push(result);
                    }
                } catch (e) {

            statusEl.innerHTML = `✅ Found ${results.length} valid haiku wallets after ${attempts} attempts`;

                        <div class="mnemonic-full" style="font-size:0.8rem; margin:0.5rem 0;">
                            ${wallet.mnemonic}
                        </div>
                        
                        <div style="display:flex; gap:0.5rem; margin-top:1rem;">
                            <button onclick="deleteWallet(${index}, this)" class="btn btn-danger" style="padding:0.45rem 0.9rem; font-size:0.8rem; flex:1;">
                                🗑️ Delete
                            </button>
                            <button onclick="copyMnemonic('${wallet.mnemonic.replace(/'/g, "\\'")}', this)" class="btn btn-secondary" style="padding:0.45rem 0.9rem; font-size:0.8rem; flex:1;">
                                📋 Copy
                            </button>
                        </div>
                        
                        <div style="margin-top:0.6rem; font-size:0.7rem; color:#475569;">
                            Saved ${new Date(wallet.timestamp).toLocaleDateString()}
                        </div>
                    </div>
                `;
            });
            
            html += `</div>`;
            container.innerHTML = html;
        }
        
        function deleteWallet(index, buttonEl) {
            if (!confirm('Delete this wallet from your list?')) return;
            
            let saved = getSavedWallets();
            saved.splice(index, 1);
            localStorage.setItem('bip39_haiku_wallets', JSON.stringify(saved));
            
            renderSavedWallets();
        }
        
        function clearAllWallets() {
            if (!confirm('Delete ALL saved wallets? This cannot be undone.')) return;
            localStorage.removeItem('bip39_haiku_wallets');
            renderSavedWallets();
        }
        
        // AES-256 Encryption for export (using Web Crypto API)
        async function encryptAES(plaintext, password) {
            const enc = new TextEncoder();
            const passwordKey = await crypto.subtle.importKey(
                'raw',
                enc.encode(password),
                { name: 'PBKDF2' },
                false,
                ['deriveKey']
            );
            
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const key = await crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 150000,
                    hash: 'SHA-256'
                },
                passwordKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt']
            );
            
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encryptedBuffer = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                enc.encode(plaintext)
            );
            
            // Combine salt + iv + ciphertext
            const combined = new Uint8Array(salt.length + iv.length + encryptedBuffer.byteLength);
            combined.set(salt, 0);
            combined.set(iv, salt.length);
            combined.set(new Uint8Array(encryptedBuffer), salt.length + iv.length);
            
            return btoa(String.fromCharCode.apply(null, combined));
        }
        
        async function exportEncryptedList() {
            const saved = getSavedWallets();
            if (saved.length === 0) {
                alert('No wallets to export.');
                return;
            }
            
            const password = prompt('Enter a strong password for AES-256 encryption of your wallet list:');
            if (!password || password.length < 6) {
                alert('Password is required and must be at least 6 characters.');
                return;
            }
            
            try {
                const jsonData = JSON.stringify(saved, null, 2);
                const encrypted = await encryptAES(jsonData, password);
                
                const blob = new Blob([encrypted], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `bip39_haiku_wallets_${new Date().toISOString().split('T')[0]}.enc.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                alert('✅ Wallet list exported as AES-256 encrypted file.\n\nKeep your password safe! You will need it to decrypt later.');
            } catch (e) {
                console.error(e);
                alert('Encryption failed. Please try again.');
            }
        }
        
        // Optional: Decrypt function (for future import)
        async function decryptAES(encryptedBase64, password) {
            try {
                const combined = new Uint8Array(atob(encryptedBase64).split('').map(c => c.charCodeAt(0)));
                const salt = combined.slice(0, 16);
                const iv = combined.slice(16, 28);
                const ciphertext = combined.slice(28);
                
                const enc = new TextEncoder();
                const passwordKey = await crypto.subtle.importKey(
                    'raw',
                    enc.encode(password),
                    { name: 'PBKDF2' },
                    false,
                    ['deriveKey']
                );
                
                const key = await crypto.subtle.deriveKey(
                    {
                        name: 'PBKDF2',
                        salt: salt,
                        iterations: 150000,
                        hash: 'SHA-256'
                    },
                    passwordKey,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['decrypt']
                );
                
                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    ciphertext
                );
                
                return new TextDecoder().decode(decryptedBuffer);
            } catch (e) {
                throw new Error('Decryption failed. Wrong password or corrupted file.');
            }
        }
        
        // Initialize the app
        function initializeApp() {
            // Load saved wallets
            renderSavedWallets();
            
            // Set default mine count based on device
            const mineCountInput = document.getElementById('mineCount');
            if (window.innerWidth < 768) {
                mineCountInput.value = 3;
            }
            
            // Keyboard shortcut hint
            document.addEventListener('keydown', function(e) {
                if (e.key === '/' && document.activeElement.tagName === 'BODY') {
                    e.preventDefault();
                    document.getElementById('mineCount').focus();
                }
            });
            
            // Welcome message in console
            console.log('%c[BIP-39 Haiku Wallet] Standalone offline app initialized. Wordlist permanently embedded.', 'color:#64748b');
            
            // Optional: Pre-mine one example on load for demo (commented to keep clean)
            // setTimeout(() => { if (document.getElementById('resultsGrid').children.length === 0) { /* could auto mine */ } }, 800);
        }
        
        // Boot the application
        window.onload = initializeApp;
        
        // Make some functions global for debugging if needed
        window.BIP39Haiku = {
            generateBip39Mnemonic,
            validateBip39Checksum,
            countSyllables,
            getSavedWallets
        };
    </script>
